{% extends "base.html" %}
{% block title %}Change password | Hostel Management{% endblock %}
{% block content %}
<section class="page-heading"><div><div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p>Enter your current password and choose a new password of at least 12 characters.</p></div></section>
<section class="content-section"><form class="row g-3" method="post" action="{{ url_for('records.change_own_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-5"><label class="form-label" for="current-password">Current password</label><input class="form-control" id="current-password" name="current_password" type="password" autocomplete="current-password" required></div><div class="col-md-5"><label class="form-label" for="new-password">New password</label><input class="form-control" id="new-password" name="new_password" type="password" minlength="12" autocomplete="new-password" required></div><div class="col-md-5"><label class="form-label" for="confirm-password">Confirm new password</label><input class="form-control" id="confirm-password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required></div><div class="col-12"><button class="btn btn-primary">Change password</button></div></form></section>
{% endblock %}
